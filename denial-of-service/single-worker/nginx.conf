error_log /dev/stderr notice;

events {
    worker_connections 1024;
}

http {
    access_log off;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    map $uri $relative_root {
        default ./;
        ~^/api/ ../../;
        ~^/u/[^/]+/ ../../;
    }

    server {
        listen 10.0.13.36:80;
        server_name _;
        return 308 https://cdn.internal$request_uri;
    }

    server {
        listen 10.0.13.37:80;
        server_name _;
        return 308 https://challenge.internal$request_uri;
    }

    server {
        listen 10.0.13.38:80;
        server_name _;
        return 308 https://victim.internal$request_uri;
    }

    server {
        listen 0.0.0.0:80;
        server_name _;

        proxy_ssl_server_name on;
        proxy_request_buffering off;
        proxy_buffering off;

        location /__cdn__/ {
            proxy_pass https://cdn.internal/;
            proxy_set_header Host cdn.internal;

            sub_filter_once off;
            sub_filter_types text/css application/javascript text/javascript;
            sub_filter "url('/fonts/" "url('../fonts/";
        }

        location /fonts/ {
            proxy_pass https://cdn.internal/fonts/;
            proxy_set_header Host cdn.internal;
        }

        location /pty {
            proxy_pass https://10.0.13.37:443;
            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_read_timeout 86400;
        }

        location /events {
            proxy_pass https://10.0.13.37:443;
            proxy_http_version 1.1;

            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_read_timeout 86400;
        }

        location / {
            proxy_pass https://10.0.13.37:443;
            proxy_http_version 1.1;

            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_redirect / ${relative_root};
            proxy_redirect http://challenge.internal/ ${relative_root};
            proxy_redirect https://challenge.internal/ ${relative_root};

            sub_filter_once off;
            sub_filter 'href="/' 'href="${relative_root}';
            sub_filter 'src="/' 'src="${relative_root}';
            sub_filter 'action="/' 'action="${relative_root}';
            sub_filter 'formaction="/' 'formaction="${relative_root}';
            sub_filter 'href="https://challenge.internal/' 'href="${relative_root}';
            sub_filter 'src="https://challenge.internal/' 'src="${relative_root}';
            sub_filter 'action="https://challenge.internal/' 'action="${relative_root}';
            sub_filter 'formaction="https://challenge.internal/' 'formaction="${relative_root}';
            sub_filter 'href="https://cdn.internal/' 'href="${relative_root}__cdn__/';
            sub_filter 'src="https://cdn.internal/' 'src="${relative_root}__cdn__/';
            sub_filter 'fetch("/' 'fetch("${relative_root}';
            sub_filter 'location.href = "/' 'location.href = "${relative_root}';
            sub_filter 'const BASE = "/' 'const BASE = "${relative_root}';
            sub_filter 'const BASE = "";' 'const BASE = ".";';
        }
    }
}
