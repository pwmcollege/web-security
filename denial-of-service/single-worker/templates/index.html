<!DOCTYPE html>
<html lang="en" class="h-full">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>DoS</title>
        <script src="https://cdn.internal/tailwind/tailwind.min.js"></script>
        <script src="https://cdn.internal/lucide/lucide.min.js"></script>
        <link rel="stylesheet" href="https://cdn.internal/fonts/inter.css" />
        <link rel="stylesheet" href="https://cdn.internal/xterm/xterm.css" />
        <link rel="stylesheet" href="/static/style.css" />
    </head>
    <body class="h-dvh overflow-hidden bg-white text-zinc-900 font-sans antialiased flex flex-col">
        <header class="shrink-0 border-b border-zinc-100 bg-white">
            <div class="h-[56px] px-5 flex items-center">
                <span class="text-[18px] font-extrabold tracking-tight text-zinc-900 select-none">
                    DoS<span class="text-zinc-300">.</span>
                </span>
            </div>
        </header>
        <div class="shrink-0 border-b border-zinc-100 px-5 h-[64px] flex items-center gap-4">
            <div class="flex items-center gap-2.5 shrink-0">
                <span id="core" class="h-2 w-2 rounded-full bg-zinc-300"></span>
                <span class="text-[13px] font-medium text-zinc-900">victim.internal</span>
            </div>
            <div class="h-7 w-px bg-zinc-200"></div>
            <div id="bars" class="flex-1 flex items-center gap-[3px]"></div>
            <div class="h-7 w-px bg-zinc-200"></div>
            <div class="shrink-0 flex items-center gap-2.5 text-[12px] text-zinc-400"><span>Failed</span><span id="fails" class="tabular-nums font-medium text-zinc-900">0 / 5</span></div>
        </div>
        <div id="flagCard" class="hidden shrink-0 border-b border-zinc-100 bg-zinc-50 px-5 py-3.5 flex items-center gap-3">
            <span id="flag" class="text-[14px] font-medium text-zinc-900 break-all"></span>
            <button id="copyFlag" aria-label="Copy flag"
                    class="ml-auto shrink-0 inline-flex items-center gap-1.5 rounded-lg px-2.5 py-1.5 text-[13px] font-medium text-zinc-500 transition-colors cursor-pointer hover:bg-zinc-200 hover:text-zinc-900">
                <span class="js-ico-copy inline-flex"><i data-lucide="copy" class="h-4 w-4"></i></span>
                <span class="js-ico-check hidden inline-flex"><i data-lucide="check" class="h-4 w-4"></i></span>
                <span id="copyLabel">Copy</span>
            </button>
        </div>
        <main class="flex-1 min-h-0 w-full flex flex-col">
            <div class="flex-1 min-h-0 bg-[#09090b] px-4 py-3">
                <div id="term" class="h-full"></div>
            </div>
        </main>
        <script src="https://cdn.internal/xterm/xterm.js"></script>
        <script src="https://cdn.internal/xterm/xterm-addon-fit.js"></script>
        <script>
            lucide.createIcons();

            const UP = "#22c55e";
            const DEGRADED = "#f59e0b";
            const DOWN = "#ef4444";

            const barsEl = document.getElementById("bars");
            const core = document.getElementById("core");
            const failsEl = document.getElementById("fails");
            const flagCard = document.getElementById("flagCard");
            const flagEl = document.getElementById("flag");

            function renderBars(history) {
                barsEl.innerHTML = "";
                let streak = 0;
                for (const ok of history) {
                    streak = ok ? 0 : streak + 1;
                    const b = document.createElement("span");
                    b.className = "flex-1 h-[26px] rounded-full";
                    b.style.backgroundColor = ok ? UP : streak >= 5 ? DOWN : DEGRADED;
                    barsEl.appendChild(b);
                }
            }

            function setStatus(up, fails) {
                core.style.backgroundColor = fails >= 5 ? DOWN : up ? UP : DEGRADED;
            }

            const es = new EventSource("events");
            es.onmessage = (e) => {
                const s = JSON.parse(e.data);
                renderBars(s.history);
                setStatus(s.up, s.fails);
                failsEl.textContent = s.fails + " / 5";
                failsEl.style.color = s.fails >= 5 ? DOWN : "";
                if (s.flag) {
                    flagEl.textContent = s.flag;
                    flagCard.classList.remove("hidden");
                } else {
                    flagCard.classList.add("hidden");
                }
            };
            es.onerror = () => {
                core.style.backgroundColor = "#a1a1aa";
            };

            const copyBtn = document.getElementById("copyFlag");
            const copyIco = copyBtn.querySelector(".js-ico-copy");
            const checkIco = copyBtn.querySelector(".js-ico-check");
            const copyLabel = document.getElementById("copyLabel");
            let copyReset;
            copyBtn.addEventListener("click", async () => {
                try {
                    await navigator.clipboard.writeText(flagEl.textContent);
                } catch (e) {}
                copyIco.classList.add("hidden");
                checkIco.classList.remove("hidden");
                copyLabel.textContent = "Copied";
                clearTimeout(copyReset);
                copyReset = setTimeout(() => {
                    checkIco.classList.add("hidden");
                    copyIco.classList.remove("hidden");
                    copyLabel.textContent = "Copy";
                }, 1500);
            });

            const term = new Terminal({
                fontFamily: "ui-monospace, SFMono-Regular, Menlo, monospace",
                fontSize: 13,
                lineHeight: 1.35,
                cursorBlink: true,
                theme: {
                    background: "#09090b",
                    foreground: "#e4e4e7",
                    cursor: "#e4e4e7",
                    cursorAccent: "#09090b",
                    selectionBackground: "#3f3f46",
                    selectionForeground: "#fafafa",
                    black: "#18181b",
                    brightBlack: "#3f3f46",
                    red: "#f87171",
                    brightRed: "#fca5a5",
                    green: "#4ade80",
                    brightGreen: "#86efac",
                    yellow: "#fbbf24",
                    brightYellow: "#fde68a",
                    blue: "#60a5fa",
                    brightBlue: "#93c5fd",
                    magenta: "#c084fc",
                    brightMagenta: "#d8b4fe",
                    cyan: "#22d3ee",
                    brightCyan: "#67e8f9",
                    white: "#e4e4e7",
                    brightWhite: "#fafafa",
                },
            });
            const fit = new FitAddon.FitAddon();
            term.loadAddon(fit);
            term.open(document.getElementById("term"));
            fit.fit();

            const wsUrl = new URL("pty", window.location.href);
            wsUrl.protocol = location.protocol === "https:" ? "wss:" : "ws:";
            const ws = new WebSocket(wsUrl);
            ws.binaryType = "arraybuffer";
            const sendResize = () => ws.readyState === 1 &&
                ws.send(JSON.stringify({ t: "resize", cols: term.cols, rows: term.rows }));
            ws.onopen = () => { sendResize(); term.focus(); };
            new ResizeObserver(() => {
                fit.fit();
                sendResize();
            }).observe(document.getElementById("term"));
            ws.onmessage = (e) => term.write(typeof e.data === "string" ? e.data : new Uint8Array(e.data));
            term.onData((d) => ws.readyState === 1 && ws.send(JSON.stringify({ t: "in", d })));
            term.attachCustomKeyEventHandler((event) => {
                if (
                    event.type !== "keydown" ||
                    !event.ctrlKey ||
                    event.altKey ||
                    event.metaKey ||
                    event.shiftKey ||
                    event.key.length !== 1
                )
                    return true;
                const code = event.key.toUpperCase().charCodeAt(0) - 64;
                if (code < 0 || code > 31) return true;
                if (ws.readyState === WebSocket.OPEN) {
                    ws.send(JSON.stringify({ t: "in", d: String.fromCharCode(code) }));
                }
                return false;
            });
            window.addEventListener("resize", () => { fit.fit(); sendResize(); });
        </script>
    </body>
</html>
