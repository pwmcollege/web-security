user root;
error_log /var/log/nginx/error.log notice;

events {
    worker_connections 1024;
}

http {
    access_log off;
    proxy_http_version 1.1;

    server {
        listen 10.0.13.36:80;
        return 308 https://cdn.internal$request_uri;
    }

    server {
        listen 10.0.13.37:80;
        return 308 https://challenge.internal$request_uri;
    }

    server {
        listen 10.0.13.38:80;
        return 308 https://app.internal$request_uri;
    }

    server {
        listen 0.0.0.0:80;
        server_name _;

        proxy_ssl_server_name on;
        proxy_buffering off;

        location /assets/ {
            proxy_pass https://cdn.internal/;
            proxy_set_header Host cdn.internal;
            proxy_ssl_server_name on;
            proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
            proxy_ssl_verify on;

            location ~ ^/assets/fonts/[^/]+\.css$ {
                rewrite ^/assets(/.*)$ $1 break;
                proxy_pass https://cdn.internal;
                proxy_set_header Host cdn.internal;
                proxy_set_header Accept-Encoding "";

                sub_filter_types text/css;
                sub_filter_once off;
                sub_filter 'url(/fonts/' 'url(./';
            }
        }

        location = /events {
            proxy_pass https://10.0.13.37:443;
            proxy_set_header Host $host;
            proxy_read_timeout 86400;
        }

        location / {
            proxy_pass https://10.0.13.37:443;
            proxy_set_header Host $host;
        }
    }

    server {
        listen 0.0.0.0:81;
        server_name _;

        location /assets/ {
            proxy_pass https://cdn.internal/;
            proxy_set_header Host cdn.internal;
            proxy_ssl_server_name on;
            proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
            proxy_ssl_verify on;

            location ~ ^/assets/fonts/[^/]+\.css$ {
                rewrite ^/assets(/.*)$ $1 break;
                proxy_pass https://cdn.internal;
                proxy_set_header Host cdn.internal;
                proxy_set_header Accept-Encoding "";

                sub_filter_types text/css;
                sub_filter_once off;
                sub_filter 'url(/fonts/' 'url(./';
            }
        }

        location / {
            proxy_pass https://10.0.13.38:443;
            proxy_ssl_server_name on;
            proxy_ssl_name app.internal;
            proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
            proxy_ssl_verify on;
            proxy_set_header Host $host;
        }
    }
}
