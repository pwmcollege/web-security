user root;
error_log /var/log/nginx/error.log notice;

events {
    worker_connections 1024;
}

http {
    access_log off;
    proxy_http_version 1.1;

    map $server_port $preview_backend {
        default http://127.0.0.1:8083;
        81 https://10.0.13.38:443;
    }

    server {
        listen 10.0.13.36:80;
        return 308 https://cdn.internal$request_uri;
    }

    server {
        listen 10.0.13.37:80;
        return 308 https://challenge.internal$request_uri;
    }

    server {
        listen 10.0.13.38:80;
        return 308 https://victim.internal$request_uri;
    }

    server {
        listen 10.0.13.37:443 ssl;
        server_name challenge.internal;
        ssl_certificate /etc/ssl/certs/internal.cert.pem;
        ssl_certificate_key /etc/ssl/private/internal.key.pem;

        location / {
            proxy_pass http://127.0.0.1:8083;
            proxy_set_header Host $host;
        }
    }

    server {
        listen 0.0.0.0:80;
        listen 0.0.0.0:81;
        server_name _;

        location = /monitor {
            proxy_pass http://127.0.0.1:8083;
            add_header Cache-Control no-store always;
        }

        location /__cdn__/ {
            proxy_pass https://cdn.internal/;
            proxy_set_header Host cdn.internal;
            proxy_ssl_server_name on;
            proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
            proxy_ssl_verify on;

            sub_filter_once off;
            sub_filter_types text/css;
            sub_filter 'url(/fonts/' 'url(../fonts/';
        }

        location / {
            proxy_pass $preview_backend;
            proxy_ssl_server_name on;
            proxy_ssl_name victim.internal;
            proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
            proxy_ssl_verify on;
            proxy_set_header Host $host;

            sub_filter_once off;
            sub_filter 'href="/' 'href="./';
            sub_filter 'src="/' 'src="./';
            sub_filter 'action="/' 'action="./';
            sub_filter 'href="https://cdn.internal/' 'href="./__cdn__/';
            sub_filter 'src="https://cdn.internal/' 'src="./__cdn__/';
        }
    }
}
