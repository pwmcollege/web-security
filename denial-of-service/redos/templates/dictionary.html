<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Dictionary</title>
        <link rel="stylesheet" href="https://cdn.internal/fonts/geist.css" />
        <link rel="stylesheet" href="{{ url_for('static', filename='dictionary.css') }}" />
        <script defer src="https://cdn.internal/motion/motion.min.js"></script>
        <script type="module" src="{{ url_for('static', filename='dictionary.js') }}"></script>
    </head>
    <body>
        <main>
            <form class="search" action="{{ url_for('lookup') }}" method="post" role="search">
                <h1><a href="{{ url_for('index') }}">Dictionary<span aria-hidden="true"></span></a></h1>
                <div class="search-control">
                    <button class="search-action" type="button" aria-label="Open search" aria-expanded="false" aria-controls="word-search">
                        <svg width="1.25rem" height="1.25rem" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                             stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="m21 21-4.34-4.34" />
                            <circle cx="11" cy="11" r="8" />
                        </svg>
                    </button>
                    <div class="search-fields" inert>
                        <input type="text" id="word-search" name="query" aria-label="Search"
                               placeholder="Search" autocomplete="off" autocapitalize="off"
                               spellcheck="false" enterkeyhint="search" />
                        <button class="search-close" type="button" aria-label="Close search">
                            <svg width="1.25rem" height="1.25rem" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <path d="m18 6-12 12M6 6l12 12" />
                            </svg>
                        </button>
                    </div>
                </div>
            </form>
            <section class="hero" id="hero" aria-label="Dictionary entry">
                <p class="notice" id="notice" role="status" hidden></p>
                <div class="entry" id="entry"></div>
            </section>
            <nav class="pagination" id="pagination" aria-label="Pagination" hidden>
                <button id="previous" type="button">Previous</button>
                <form class="page" id="page-jump">
                    <input type="number" id="page" min="1" step="1" required aria-label="Page number"
                           aria-describedby="page-count" enterkeyhint="go" />
                    <span id="page-count"></span>
                </form>
                <button id="next" type="button">Next</button>
            </nav>
        </main>
        <template id="entry-template">
            <article>
                <h2></h2>
                <p class="pronunciation"></p>
                <ol></ol>
                <details hidden>
                    <summary>More definitions</summary>
                    <ol start="3"></ol>
                </details>
            </article>
        </template>
    </body>
</html>
