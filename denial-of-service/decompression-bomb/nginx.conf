user root;
error_log /var/log/nginx/error.log notice;

events {
    worker_connections 1024;
}

http {
    access_log off;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    map $http_x_forwarded_proto $unzip_scheme {
        default $scheme;
        http http;
        https https;
    }

    server {
        listen 10.0.13.36:80;
        server_name _;
        return 308 https://cdn.internal$request_uri;
    }

    server {
        listen 10.0.13.37:80;
        server_name _;
        return 308 https://challenge.internal$request_uri;
    }

    server {
        listen 10.0.13.38:80;
        server_name _;
        return 308 https://app.internal$request_uri;
    }

    server {
        listen 0.0.0.0:81;
        server_name _;

        client_header_timeout 500ms;
        client_body_timeout 500ms;
        client_max_body_size 1000000;
        proxy_ssl_server_name on;

        location /assets/ {
            proxy_pass https://cdn.internal/;
            proxy_set_header Host cdn.internal;
            proxy_ssl_server_name on;
            proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
            proxy_ssl_verify on;

            location ~ ^/assets/fonts/[^/]+\.css$ {
                rewrite ^/assets(/.*)$ $1 break;
                proxy_pass https://cdn.internal;
                proxy_set_header Host cdn.internal;
                proxy_set_header Accept-Encoding "";

                sub_filter_types text/css;
                sub_filter_once off;
                sub_filter 'url(/fonts/' 'url(./';
            }
        }

        location / {
            proxy_pass https://10.0.13.38:443;
            proxy_ssl_name app.internal;
            proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
            proxy_ssl_verify on;
            proxy_http_version 1.1;
            proxy_request_buffering on;

            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $unzip_scheme;
        }
    }

    server {
        listen 0.0.0.0:80;
        server_name _;

        proxy_ssl_server_name on;
        proxy_request_buffering off;
        proxy_buffering off;

        location /assets/ {
            proxy_pass https://cdn.internal/;
            proxy_set_header Host cdn.internal;
            proxy_ssl_server_name on;
            proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
            proxy_ssl_verify on;

            location ~ ^/assets/fonts/[^/]+\.css$ {
                rewrite ^/assets(/.*)$ $1 break;
                proxy_pass https://cdn.internal;
                proxy_set_header Host cdn.internal;
                proxy_set_header Accept-Encoding "";

                sub_filter_types text/css;
                sub_filter_once off;
                sub_filter 'url(/fonts/' 'url(./';
            }
        }

        location /events {
            proxy_pass https://10.0.13.37:443;
            proxy_http_version 1.1;

            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_read_timeout 86400;
        }

        location / {
            proxy_pass https://10.0.13.37:443;
            proxy_http_version 1.1;

            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
