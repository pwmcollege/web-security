<!DOCTYPE html>
<html lang="en" class="scheme-light bg-white font-sans text-(color:--color-ink) antialiased">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="csrf-token" content="{{ csrf_token }}" />
        <meta name="description" content="Open ZIP and TAR archives and download the files inside." />
        <title>Unarchive</title>
        <link rel="icon" href="data:," />
        <link rel="stylesheet" href="./__cdn__/fonts/geist.css" />
        <script src="./__cdn__/tailwind/tailwind.min.js"></script>
        <link rel="stylesheet" href="./static/unzip.css" />
        <script src="./__cdn__/lucide/lucide.min.js" defer></script>
        <script src="./__cdn__/motion/motion.min.js" defer></script>
        <script src="./static/unzip.js" defer></script>
    </head>
    <body class="m-0 flex min-h-dvh flex-col">
        <a class="fixed start-3 top-2 z-1 inline-flex min-h-11 -translate-y-[150%] items-center rounded-[999px] bg-(--color-ink) px-4 py-2 text-sm/[normal] text-white focus:translate-none" href="#main">Skip to content</a>
        <header class="site-header mt-4 flex min-h-14 flex-none items-center self-center rounded-full bg-(--color-surface) py-1 pe-1.75 ps-[clamp(0.75rem,2vw,1.5rem)] shadow-[0_0.0625rem_0.25rem_rgb(24_24_27/0.08),0_0.375rem_1.125rem_rgb(24_24_27/0.07)]">
            <a class="inline-flex min-h-11 min-w-11 flex-none items-center rounded-lg text-[1.1875rem] font-extrabold tracking-[-0.04em]" href="./" aria-label="Unarchive home"><span>Unarchive<span class="brand-dot ms-0.5 inline-block size-1 rounded-full bg-[#a1a1aa]" aria-hidden="true"></span></span></a>
        </header>
        <main id="main" class="workspace flex flex-1 flex-col pb-8" tabindex="-1">
            <section id="upload-view" class="archive-workspace m-auto" aria-labelledby="upload-title">
                <form id="archive-form">
                    <input id="archive-input" type="file" accept="{{ archive_extensions }}" hidden />
                    <div id="drop-zone" class="drop-zone flex flex-col items-center justify-center gap-5 px-[clamp(1.125rem,5vw,2.25rem)] py-[clamp(1.875rem,6vw,3rem)] text-center motion-safe:transition-[background-color,border-color] motion-safe:duration-150">
                        <div class="min-w-0 max-w-full">
                            <h1 id="upload-title" dir="auto">Drop an archive here</h1>
                            <p id="file-limit" class="mt-2 text-sm/normal text-(color:--color-muted) tabular-nums">ZIP or TAR · Up to 1 MB</p>
                            <p id="selected-size" class="mt-2 text-sm/normal text-(color:--color-muted) tabular-nums" hidden></p>
                        </div>
                        <div class="flex max-w-full flex-wrap items-center gap-2">
                            <button id="browse-button" class="button button-primary" type="button">
                                <i id="browse-icon" class="size-4.25" data-lucide="upload" aria-hidden="true"></i>
                                <span id="browse-label">Choose file</span>
                            </button>
                            <button id="remove-button" class="button button-quiet button-destructive" type="button" hidden>
                                Remove file
                            </button>
                            <button id="extract-button" class="button button-primary" type="submit" hidden>
                                <span id="extract-label">Extract files</span>
                                <i id="extract-arrow" class="size-4.25" data-lucide="arrow-right" aria-hidden="true"></i>
                                <i id="extract-spinner" class="size-3.75 motion-safe:animate-[unarchive-spin_800ms_linear_infinite]"
                                   data-lucide="loader-circle" aria-hidden="true" hidden></i>
                            </button>
                        </div>
                    </div>
                </form>
                <p id="upload-error" class="error-message" role="alert"></p>
                <noscript><p class="error-message">Enable JavaScript to open an archive.</p></noscript>
            </section>

            <section id="results-view" class="archive-workspace mx-auto" aria-labelledby="results-title" hidden>
                <div class="results-toolbar flex items-center gap-2.5">
                    <div class="results-location min-w-0 flex-1">
                        <h1 id="results-title" dir="auto" tabindex="-1"></h1>
                        <nav id="folder-location" class="folder-location" aria-label="Folder location" hidden>
                            <ol id="folder-breadcrumbs" class="m-0 flex list-none items-center gap-x-0.5 p-0" role="list"></ol>
                        </nav>
                        <p id="results-summary" class="mt-1 text-sm/normal text-(color:--color-muted) tabular-nums"></p>
                    </div>
                    <button id="reset-button" class="button button-upload flex-none" type="button">
                        <i class="size-4.25" data-lucide="upload" aria-hidden="true"></i>
                        Upload another
                    </button>
                </div>
                <p id="results-error" class="error-message" role="alert"></p>
                <div id="file-list">
                    <div class="file-list-heading py-2 text-[0.8125rem] text-(color:--color-muted)" aria-hidden="true"><span>Name</span><span>Size</span></div>
                    <ul id="file-rows" class="m-0 list-none p-0" aria-label="Extracted files" role="list"></ul>
                </div>
                <p id="empty-archive" class="empty-archive py-5.5 text-[0.9375rem]/normal text-(color:--color-muted)" hidden>This archive is empty.</p>
            </section>
        </main>
        <p id="status-message" class="sr-only" role="status"></p>

        <template id="breadcrumb-separator-template">
            <i class="size-3.5 text-[#a1a1aa]" data-lucide="chevron-right" aria-hidden="true"></i>
        </template>

        <template id="file-row-template">
            <li class="file-row">
                <div class="file-details flex min-w-0 items-center gap-2.5">
                    <i class="size-5 text-(color:--color-muted)" data-lucide="file" aria-hidden="true"></i>
                    <span class="text-sm/[1.45] wrap-anywhere" data-file-path dir="auto"></span>
                </div>
                <span class="file-size text-[0.8125rem] text-(color:--color-muted) tabular-nums"></span>
                <a class="download-link grid size-11 place-items-center rounded-[999px] text-(color:--color-muted) motion-safe:transition-[color] motion-safe:ease-[ease]">
                    <i class="size-4.75" data-lucide="download" aria-hidden="true"></i>
                </a>
            </li>
        </template>
        <template id="folder-row-template">
            <li>
                <button class="file-row folder-row w-full bg-transparent text-start text-(color:--color-ink) hover:text-black" type="button">
                    <span class="file-details flex min-w-0 items-center gap-2.5">
                        <i class="size-5 text-(color:--color-muted)" data-lucide="folder" aria-hidden="true"></i>
                        <span class="text-sm/[1.45] wrap-anywhere" data-file-path dir="auto"></span>
                    </span>
                    <i class="folder-chevron size-4.25 text-(color:--color-muted)" data-lucide="chevron-right" aria-hidden="true"></i>
                </button>
            </li>
        </template>
    </body>
</html>
