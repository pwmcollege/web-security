<!DOCTYPE html>
<html lang="en" class="scheme-light bg-white font-sans text-(color:--color-ink) antialiased">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="csrf-token" content="{{ csrf_token }}" />
        <meta name="description" content="Open ZIP and TAR archives and download the files inside." />
        <title>Unarchive</title>
        <link rel="stylesheet" href="./__cdn__/fonts/geist.css" />
        <script src="./__cdn__/tailwind/tailwind.min.js"></script>
        <link rel="stylesheet" href="./static/unzip.css" />
        <script src="./static/unzip.js" defer></script>
    </head>
    <body class="m-0 flex min-h-dvh flex-col">
        <a class="fixed start-3 top-2 z-1 inline-flex min-h-11 -translate-y-[150%] items-center rounded-[999px] bg-(--color-ink) px-4 py-2 text-sm/[normal] text-white focus:translate-none" href="#main">Skip to content</a>
        <header class="site-header mt-4 flex min-h-14 w-4/5 flex-none items-center self-center rounded-[999px] bg-(--color-surface) py-1 pe-1.75 ps-[clamp(0.75rem,2vw,1.5rem)] shadow-[0_0.0625rem_0.25rem_rgb(24_24_27/0.08),0_0.375rem_1.125rem_rgb(24_24_27/0.07)]">
            <a class="inline-flex min-h-11 min-w-11 flex-none items-center rounded-[8px] text-[1.1875rem] font-extrabold tracking-tight" href="./" aria-label="Unarchive home"><span>Unarchive<span class="brand-dot ms-0.5 inline-block size-1 rounded-[50%] bg-[#d4d4d8]" aria-hidden="true"></span></span></a>
        </header>
        <main id="main" class="workspace flex flex-1 flex-col px-[clamp(1.125rem,5vw,3rem)] py-[clamp(1.625rem,5vw,4rem)]" tabindex="-1">
            <section id="upload-view" class="m-auto w-full max-w-160" aria-labelledby="upload-title">
                <form id="archive-form">
                    <input id="archive-input" type="file" accept="{{ archive_extensions }}" hidden />
                    <div id="drop-zone" class="drop-zone flex flex-col items-center justify-center gap-6 rounded-[24px] bg-(--color-surface) px-[clamp(1.125rem,5vw,2.25rem)] py-[clamp(1.875rem,6vw,3.25rem)] text-center motion-safe:transition-[background-color,border-color] motion-safe:duration-[160ms] motion-safe:ease-[ease]">
                        <div class="upload-heading flex max-w-full flex-col items-center gap-4">
                            <span class="archive-mark grid size-12 flex-none place-items-center rounded-[15px] bg-[#ededf0] text-(color:--color-muted)" aria-hidden="true">
                                <svg viewBox="0 0 24 24" width="1.5625rem" height="1.5625rem" fill="none" stroke="currentColor"
                                     stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                                    <rect x="3" y="4" width="18" height="4" rx="1" />
                                    <path d="M5 8v11a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8m-9 4h4" />
                                </svg>
                            </span>
                            <div class="min-w-0 max-w-full">
                                <h1 id="upload-title" dir="auto">Drop an archive here</h1>
                                <p id="file-limit" class="mt-2 text-sm/normal text-(color:--color-muted) tabular-nums">ZIP or TAR · Up to 1 MB</p>
                                <p id="selected-size" class="mt-2 text-sm/normal text-(color:--color-muted) tabular-nums" hidden></p>
                            </div>
                        </div>
                        <div class="flex max-w-full flex-wrap items-center gap-2">
                            <button id="browse-button" class="button button-primary" type="button">
                                <svg id="browse-icon" viewBox="0 0 24 24" width="1.0625rem" height="1.0625rem" fill="none"
                                     stroke="currentColor" stroke-width="1.75" stroke-linecap="round"
                                     stroke-linejoin="round" aria-hidden="true">
                                    <path d="M12 16V3m-4 4 4-4 4 4M5 16v4h14v-4" />
                                </svg>
                                <span id="browse-label">Choose file</span>
                            </button>
                            <button id="remove-button" class="button button-quiet button-destructive" type="button" hidden>
                                Remove file
                            </button>
                            <button id="extract-button" class="button button-primary" type="submit" hidden>
                                <span id="extract-label">Extract files</span>
                                <svg id="extract-arrow" viewBox="0 0 24 24" width="1.0625rem" height="1.0625rem" fill="none"
                                     stroke="currentColor" stroke-width="1.75" stroke-linecap="round"
                                     stroke-linejoin="round" aria-hidden="true">
                                    <path d="M5 12h14m-5-5 5 5-5 5" />
                                </svg>
                                <span id="extract-spinner" class="spinner size-3.75 rounded-[50%] motion-safe:animate-[unarchive-spin_800ms_linear_infinite]" aria-hidden="true" hidden></span>
                            </button>
                        </div>
                    </div>
                </form>
                <p id="upload-error" class="error-message" role="alert"></p>
                <noscript><p class="error-message">Enable JavaScript to open an archive.</p></noscript>
            </section>

            <section id="results-view" class="mx-auto w-full max-w-210" aria-labelledby="results-title" hidden>
                <div class="mb-[clamp(1.375rem,4vw,2.25rem)] flex flex-wrap items-start gap-x-6 gap-y-4">
                    <div class="min-w-0 flex-[1_1_24rem]">
                        <h1 id="results-title" class="w-fit max-w-full truncate rounded-[6px]" dir="auto" tabindex="-1"></h1>
                        <p id="results-summary" class="mt-2 text-sm/normal text-(color:--color-muted) tabular-nums"></p>
                    </div>
                    <button id="reset-button" class="button button-primary flex-none" type="button">
                        <svg viewBox="0 0 24 24" width="1.0625rem" height="1.0625rem" fill="none" stroke="currentColor"
                             stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M12 16V3m-4 4 4-4 4 4M5 16v4h14v-4" />
                        </svg>
                        Upload another
                    </button>
                </div>
                <p id="results-error" class="error-message" role="alert"></p>
                <div id="file-list">
                    <nav class="file-toolbar mb-1" aria-label="Folder location">
                        <ol id="folder-breadcrumbs" class="m-0 flex list-none flex-wrap items-center gap-x-1 p-0" role="list"></ol>
                    </nav>
                    <div class="file-list-heading py-2 text-[0.8125rem] text-(color:--color-muted)" aria-hidden="true"><span>Name</span><span>Size</span></div>
                    <ul id="file-rows" class="m-0 list-none p-0" aria-label="Extracted files" role="list"></ul>
                </div>
                <p id="empty-archive" class="empty-archive py-5.5 text-[0.9375rem]/normal text-(color:--color-muted)" hidden>This archive is empty.</p>
            </section>
        </main>
        <p id="status-message" class="sr-only" role="status"></p>

        <template id="file-row-template">
            <li class="file-row">
                <div class="file-details flex min-w-0 items-center gap-2.5">
                    <svg class="text-(color:--color-muted)" viewBox="0 0 24 24" width="1.25rem" height="1.25rem" fill="none"
                         stroke="currentColor" stroke-width="1.5" stroke-linecap="round"
                         stroke-linejoin="round" aria-hidden="true">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Zm0 0v6h6" />
                    </svg>
                    <span class="text-sm/[1.45] wrap-anywhere" data-file-path dir="auto"></span>
                </div>
                <span class="file-size text-[0.8125rem] text-(color:--color-muted) tabular-nums"></span>
                <a class="download-link grid size-11 place-items-center rounded-[999px] text-(color:--color-muted) motion-safe:transition-[color] motion-safe:ease-[ease]">
                    <svg viewBox="0 0 24 24" width="1.1875rem" height="1.1875rem" fill="none" stroke="currentColor"
                         stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M12 3v12m-4-4 4 4 4-4M5 16v4h14v-4" />
                    </svg>
                </a>
            </li>
        </template>
        <template id="folder-row-template">
            <li>
                <button class="file-row folder-row w-full bg-transparent text-start text-(color:--color-ink) hover:text-black" type="button">
                    <span class="file-details flex min-w-0 items-center gap-2.5">
                        <svg class="text-(color:--color-muted)" viewBox="0 0 24 24" width="1.25rem" height="1.25rem" fill="none"
                             stroke="currentColor" stroke-width="1.5" stroke-linecap="round"
                             stroke-linejoin="round" aria-hidden="true">
                            <path d="M20 20H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h5l2 2h9a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2Z" />
                        </svg>
                        <span class="text-sm/[1.45] wrap-anywhere" data-file-path dir="auto"></span>
                    </span>
                    <svg class="folder-chevron text-(color:--color-muted)" viewBox="0 0 24 24" width="1.0625rem" height="1.0625rem" fill="none"
                         stroke="currentColor" stroke-width="1.75" stroke-linecap="round"
                         stroke-linejoin="round" aria-hidden="true">
                        <path d="m9 5 7 7-7 7" />
                    </svg>
                </button>
            </li>
        </template>
    </body>
</html>
