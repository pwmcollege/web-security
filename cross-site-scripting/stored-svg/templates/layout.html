<!DOCTYPE html>
<html lang="en" class="h-full">
    <head>
        {% set asset_root = 'https://cdn.internal' if request.host == 'challenge.internal' else './assets' %}
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>pwnpost</title>
        <script src="{{ asset_root }}/tailwind/tailwind.min.js"></script>
        <script src="{{ asset_root }}/lucide/lucide.min.js"></script>
        <link rel="stylesheet" href="{{ asset_root }}/fonts/geist.css" />
        <link rel="stylesheet" href="./static/style.css" />
    </head>
    <body class="min-h-full bg-white text-zinc-900 font-sans antialiased flex flex-col">
        {% if not hide_chrome %}
            <header class="sticky top-0 z-50 bg-white/80 backdrop-blur-[1.5rem] border-b-[0.0625rem] border-zinc-100">
                <div class="mx-auto max-w-[37.5rem] h-[3.75rem] px-5 flex items-center justify-between">
                    <a href="./"
                       class="text-[1.1875rem] font-extrabold tracking-tight text-zinc-900 select-none">
                        pwnpost<span class="text-zinc-300">.</span>
                    </a>
                    <button type="button"
                            id="logout"
                            class="cursor-pointer text-[0.8125rem] font-medium text-zinc-400 hover:text-zinc-900 motion-safe:transition-colors">
                        Log out
                    </button>
                </div>
            </header>
        {% endif %}
        <main class="flex-grow w-full mx-auto max-w-[37.5rem] sm:border-x-[0.0625rem] border-zinc-100">
            {% block content %}{% endblock %}
        </main>
        <script>
      lucide.createIcons();

      const logout = document.getElementById("logout");
      if (logout) {
        logout.addEventListener("click", async () => {
          await fetch("./api/auth/logout", { method: "POST" });
          location.href = "./login";
        });
      }

      const closeMenus = () =>
        document
          .querySelectorAll("[data-menu]")
          .forEach((m) => m.classList.add("hidden"));

      const avatarPop = document.querySelector("[data-avatar-pop]");
      let avatarOpenTrigger = null;
      const isAvatarOpen = () =>
        avatarPop && !avatarPop.classList.contains("pointer-events-none");
      const openAvatar = (trigger) => {
        if (!avatarPop) return;
        const anchor = trigger.getBoundingClientRect();
        // snap to hidden state at the new anchor with no transition,
        // then replay the pop-in so it re-appears (never slides/teleports)
        avatarPop.style.transition = "none";
        avatarPop.classList.add("opacity-0", "motion-safe:scale-95");
        avatarPop.classList.remove("pointer-events-none");
        avatarPop.style.top = `calc(${anchor.bottom}px + 0.375rem)`;
        avatarPop.style.left = `clamp(0.5rem, ${anchor.left}px, calc(100% - ${avatarPop.offsetWidth}px - 0.5rem))`;
        void avatarPop.offsetWidth;
        avatarPop.style.transition = "";
        avatarPop.classList.remove("opacity-0", "motion-safe:scale-95");
        avatarOpenTrigger = trigger;
      };
      const closeAvatar = () => {
        if (!avatarPop) return;
        avatarPop.style.transition = "";
        avatarPop.classList.add("opacity-0", "motion-safe:scale-95", "pointer-events-none");
        avatarOpenTrigger = null;
      };

      document.addEventListener("click", (e) => {
        const avatarTrigger = e.target.closest("[data-avatar-trigger]");
        if (avatarTrigger) {
          e.stopPropagation();
          closeMenus();
          if (isAvatarOpen() && avatarOpenTrigger === avatarTrigger) {
            closeAvatar();
          } else {
            openAvatar(avatarTrigger);
          }
          return;
        }

        const trigger = e.target.closest("[data-menu-trigger]");
        if (trigger) {
          e.stopPropagation();
          const menu = trigger.parentElement.querySelector("[data-menu]");
          const isOpen = !menu.classList.contains("hidden");
          closeMenus();
          closeAvatar();
          if (!isOpen) menu.classList.remove("hidden");
          return;
        }

        if (!e.target.closest("[data-menu]")) closeMenus();
        if (!e.target.closest("[data-avatar-pop]")) closeAvatar();
      });

      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") {
          closeMenus();
          closeAvatar();
        }
      });
        </script>
    </body>
</html>
