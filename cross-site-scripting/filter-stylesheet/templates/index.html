<!DOCTYPE html>
<html lang="en" class="h-full">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Incognito</title>
        <script src="https://cdn.internal/lucide/lucide.min.js"></script>
        <link rel="stylesheet" href="https://cdn.internal/fonts/geist.css" />
        <link rel="stylesheet" href="/static/style.css" />
    </head>
    <body class="min-h-full bg-white text-zinc-900 font-sans antialiased flex flex-col">
        <header class="sticky top-0 z-50 bg-white/80 backdrop-blur-xl border-b-[0.0625rem] border-zinc-100">
            <div class="mx-auto max-w-[37.5rem] h-[3.75rem] px-5 flex items-center gap-3">
                <div class="text-[1.1875rem] font-extrabold tracking-tight text-zinc-900">
                    Incognito<span class="text-zinc-300">.</span>
                </div>
            </div>
        </header>
        <main class="flex-grow w-full mx-auto max-w-[37.5rem] sm:border-x-[0.0625rem] border-zinc-100 flex flex-col">
            <div class="flex-grow flex flex-col px-5 py-6 gap-4">
                {% if banned %}
                    <div class="flex-grow flex flex-col items-center justify-center gap-2 text-center py-10">
                        <div class="flex h-11 w-11 items-center justify-center rounded-full bg-rose-50 text-rose-500">
                            <i data-lucide="shield-x" class="h-5 w-5"></i>
                        </div>
                        <p class="text-[0.875rem] font-semibold text-zinc-900">Message blocked</p>
                    </div>
                {% elif msg %}
                    <div class="flex flex-col items-end gap-1.5">
                        <div class="max-w-[78%] rounded-[20px] rounded-br-md bg-zinc-900 px-4 py-2.5 text-[0.9375rem] leading-6 text-white break-words">
                            {{ msg|safe }}
                        </div>
                        <button type="button"
                                id="shareBtn"
                                onclick="copyShare()"
                                class="flex items-center gap-1.5 pr-1 text-[0.75rem] font-medium text-zinc-400 hover:text-zinc-900 motion-safe:transition-colors">
                            <i data-lucide="link" class="h-3.5 w-3.5" id="shareIcon"></i>
                            <span id="shareText">Share this message</span>
                        </button>
                    </div>
                {% else %}
                    <div class="flex-grow flex flex-col items-center justify-center gap-2 text-center py-10">
                        <div class="flex h-11 w-11 items-center justify-center rounded-full bg-zinc-100 text-zinc-400">
                            <i data-lucide="message-circle-dashed" class="h-5 w-5"></i>
                        </div>
                        <p class="text-[0.875rem] font-semibold text-zinc-900">No messages yet</p>
                    </div>
                {% endif %}
            </div>
            <form action="/"
                  method="GET"
                  class="sticky bottom-0 bg-white/80 backdrop-blur-xl border-t-[0.0625rem] border-zinc-100 px-4 py-3">
                <div class="flex items-center gap-2">
                    <input type="text"
                           name="msg"
                           required
                           autocomplete="off"
                           placeholder="Message…"
                           class="min-w-0 flex-grow rounded-full bg-zinc-100 border-[0.0625rem] border-zinc-200 px-4 py-2.5 text-[0.9375rem] text-zinc-900 placeholder:text-zinc-400 outline-none motion-safe:transition-all focus:border-zinc-300 focus:bg-white" />
                    <button type="submit"
                            aria-label="Send"
                            class="flex h-10 w-10 shrink-0 items-center justify-center rounded-full bg-zinc-900 text-white hover:bg-zinc-700 motion-safe:active:scale-95 motion-safe:transition-all">
                        <i data-lucide="arrow-up" class="h-5 w-5"></i>
                    </button>
                </div>
            </form>
        </main>
        <script>
      window.copyShare = function () {
        navigator.clipboard.writeText(window.location.href);

        const icon = document.getElementById("shareIcon");
        const text = document.getElementById("shareText");

        icon.setAttribute("data-lucide", "check");
        text.textContent = "Link copied";
        lucide.createIcons();

        setTimeout(() => {
          icon.setAttribute("data-lucide", "link");
          text.textContent = "Share this message";
          lucide.createIcons();
        }, 1500);
      };

      lucide.createIcons();
        </script>
    </body>
</html>
