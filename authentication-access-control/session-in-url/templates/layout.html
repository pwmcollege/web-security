<!DOCTYPE html>
<html lang="en" class="h-full">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Mail</title>
        {% set root = app_root | default('./') %}
        {% set internal = request.host.split(':', 1)[0] | lower == 'challenge.internal' %}
        {% set asset_base = 'https://cdn.internal/' if internal else root ~ 'assets/' %}
        <script src="{{ asset_base }}tailwind/tailwind.min.js"></script>
        <script src="{{ asset_base }}lucide/lucide.min.js"></script>
        <link rel="stylesheet" href="{{ asset_base }}fonts/geist.css" />
        <link rel="stylesheet" href="{{ root }}static/style.css" />
    </head>
    <body class="h-dvh overflow-hidden bg-white text-zinc-900 font-sans antialiased flex flex-col">
        {% if not hide_chrome %}
            <header class="shrink-0 border-b-[0.0625rem] border-zinc-100 bg-white">
                <div class="mx-auto max-w-[67.5rem] h-[3.5rem] px-5 flex items-center justify-between">
                    <a href="./"
                       class="flex items-center gap-2 text-[1.125rem] font-extrabold tracking-tight text-zinc-900 select-none">
                        <i data-lucide="mail" class="h-5 w-5 text-zinc-900"></i>
                        <span>Mail<span class="text-zinc-300">.</span></span>
                    </a>
                    <button type="button"
                            id="logout"
                            class="cursor-pointer text-[0.8125rem] font-medium text-zinc-400 hover:text-zinc-900 motion-safe:transition-colors">
                        Log out
                    </button>
                </div>
            </header>
        {% endif %}
        <main class="flex-1 min-h-0 w-full mx-auto max-w-[67.5rem] flex flex-col">
            {% block content %}{% endblock %}
        </main>
        <script>
      lucide.createIcons();

      const logout = document.getElementById("logout");
      if (logout) {
          logout.addEventListener("click", async () => {
              await fetch({{ (root ~ "api/auth/logout") | tojson }}, { method: "POST" });
              location.href = {{ (root ~ "login") | tojson }};
          });
      }
        </script>
    </body>
</html>
