<!DOCTYPE html>
<html lang="en" class="h-full">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Vantage</title>
        <script src="https://cdn.internal/tailwind/tailwind.min.js"></script>
        <link rel="stylesheet" href="https://cdn.internal/fonts/inter.css" />
        <link rel="stylesheet" href="/static/style.css" />
    </head>
    <body class="min-h-full bg-white text-zinc-900 font-sans antialiased flex flex-col">
        <header class="sticky top-0 z-50 bg-white/80 backdrop-blur-xl border-b border-zinc-100">
            <div class="mx-auto max-w-[720px] h-[60px] px-5 flex items-center">
                <div class="text-[19px] font-extrabold tracking-tight text-zinc-900">
                    Vantage<span class="text-zinc-300">.</span>
                </div>
            </div>
        </header>
        <main class="w-full mx-auto max-w-[720px] px-5 py-8 flex flex-col gap-2.5">
            <h2 class="text-[13px] font-semibold tracking-tight text-zinc-900">Session key</h2>
            <div class="rounded-xl border border-zinc-200 shadow-sm p-4 flex flex-col gap-3">
                <form id="check" class="flex items-center gap-2">
                    <input name="key"
                           autocomplete="off"
                           spellcheck="false"
                           placeholder="Key"
                           class="min-w-0 flex-1 rounded-lg border border-zinc-200 bg-zinc-50 px-3.5 py-2 font-mono text-[13px] text-zinc-900 placeholder:text-zinc-400 outline-none transition-colors focus:border-zinc-300 focus:bg-white" />
                    <button type="submit"
                            class="shrink-0 cursor-pointer rounded-lg bg-zinc-900 px-3.5 py-2 text-[13px] font-semibold text-white transition-all hover:bg-zinc-800 active:scale-95">
                        Verify
                    </button>
                </form>
                <p id="result" class="hidden font-mono text-[13px] break-words"></p>
            </div>
        </main>
        <script>
      const form = document.getElementById("check");
      const result = document.getElementById("result");

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const key = form.elements.key.value;
        const data = await (
          await fetch("/api/flag?key=" + encodeURIComponent(key))
        ).json();
        result.className =
          "font-mono text-[13px] break-words " +
          (data.error ? "text-rose-600" : "text-zinc-900");
        result.textContent = data.error || data.flag;
      });
        </script>
    </body>
</html>
