<!doctype html>
<html lang="en" class="h-full">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>{{ brand }}</title>
        <script src="https://cdn.internal/tailwind/tailwind.min.js"></script>
        <script src="https://cdn.internal/lucide/lucide.min.js"></script>
        <link rel="stylesheet" href="https://cdn.internal/fonts/inter.css" />
        <link rel="stylesheet" href="https://cdn.internal/xterm/xterm.css" />
        <link rel="stylesheet" href="/static/style.css" />
    </head>

    <body class="h-dvh overflow-hidden bg-white text-zinc-900 font-sans antialiased flex flex-col">
        <header class="sticky top-0 z-50 bg-white/80 backdrop-blur-xl border-b border-zinc-100">
            <div class="mx-auto max-w-[720px] h-[60px] px-5 flex items-center">
                <span class="text-[19px] font-extrabold tracking-tight text-zinc-900 select-none">
                    {{ brand }}<span class="text-zinc-300">.</span>
                </span>
            </div>
        </header>

        <main class="flex-1 min-h-0 w-full mx-auto max-w-[720px] px-5 py-8 flex flex-col">
            <div class="mb-4 flex items-center justify-between gap-4">
                <h1 class="text-[15px] font-semibold tracking-tight text-zinc-900">Shell</h1>
                <button
                    id="trigger"
                    class="inline-flex items-center gap-2 rounded-lg bg-zinc-900 px-3.5 py-2 text-[13px] font-semibold text-white transition-colors hover:bg-zinc-800 disabled:cursor-not-allowed disabled:opacity-50"
                >
                    <i data-lucide="zap" class="w-4 h-4"></i>
                    <span id="trigger-label">{{ trigger_label }}</span>
                </button>
            </div>

            <div class="flex-1 min-h-0 rounded-xl border border-zinc-200 bg-[#09090b] p-3 shadow-sm">
                <div id="term" class="h-full"></div>
            </div>
        </main>

        <script src="https://cdn.internal/xterm/xterm.js"></script>
        <script src="https://cdn.internal/xterm/xterm-addon-fit.js"></script>
        <script>
            lucide.createIcons();

            const term = new Terminal({
                fontFamily: "ui-monospace, SFMono-Regular, Menlo, monospace",
                fontSize: 13,
                lineHeight: 1.35,
                cursorBlink: true,
                theme: {
                    background: "#09090b",
                    foreground: "#e4e4e7",
                    cursor: "#e4e4e7",
                    selectionBackground: "#3f3f46",
                    black: "#18181b", brightBlack: "#52525b",
                    green: "#4ade80", brightGreen: "#86efac",
                    red: "#f87171", cyan: "#22d3ee", blue: "#60a5fa",
                },
            });
            const fit = new FitAddon.FitAddon();
            term.loadAddon(fit);
            term.open(document.getElementById("term"));
            fit.fit();

            const wsUrl = new URL("pty", window.location.href);
            wsUrl.protocol = location.protocol === "https:" ? "wss:" : "ws:";
            const ws = new WebSocket(wsUrl);
            ws.binaryType = "arraybuffer";
            const sendResize = () => ws.readyState === 1 &&
                ws.send(JSON.stringify({ t: "resize", cols: term.cols, rows: term.rows }));
            ws.onopen = () => { sendResize(); term.focus(); };
            ws.onmessage = (e) => term.write(typeof e.data === "string" ? e.data : new Uint8Array(e.data));
            term.onData((d) => ws.readyState === 1 && ws.send(JSON.stringify({ t: "in", d })));
            window.addEventListener("resize", () => { fit.fit(); sendResize(); });

            const btn = document.getElementById("trigger");
            const btnLabel = document.getElementById("trigger-label");
            const original = btnLabel.textContent;
            btn.addEventListener("click", async () => {
                btn.disabled = true;
                btnLabel.textContent = "Triggered";
                try {
                    await fetch("{{ endpoint }}", { method: "POST" });
                } catch (e) {}
                setTimeout(() => { btn.disabled = false; btnLabel.textContent = original; }, 1500);
            });
        </script>
    </body>
</html>
