<!DOCTYPE html>
<html lang="en" class="h-full">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Shell</title>
        <script src="https://cdn.internal/tailwind/tailwind.min.js"></script>
        <link rel="stylesheet" href="https://cdn.internal/fonts/inter.css" />
        <link rel="stylesheet" href="https://cdn.internal/xterm/xterm.css" />
        <link rel="stylesheet" href="/static/style.css" />
    </head>
    <body class="h-dvh overflow-hidden bg-white text-zinc-900 font-sans antialiased flex flex-col">
        <header class="shrink-0 border-b border-zinc-100 bg-white">
            <div class="h-[56px] px-5 flex items-center">
                <span class="text-[18px] font-extrabold tracking-tight text-zinc-900 select-none">
                    Shell<span class="text-zinc-300">.</span>
                </span>
            </div>
        </header>
        <main class="flex-1 min-h-0 w-full flex flex-col">
            <div class="flex-1 min-h-0 bg-[#09090b] px-4 py-3">
                <div id="term" class="h-full"></div>
            </div>
        </main>
        <script src="https://cdn.internal/xterm/xterm.js"></script>
        <script src="https://cdn.internal/xterm/xterm-addon-fit.js"></script>
        <script>
      const term = new Terminal({
        fontFamily: "ui-monospace, SFMono-Regular, Menlo, monospace",
        fontSize: 13,
        lineHeight: 1.35,
        cursorBlink: true,
        theme: {
          background: "#09090b",
          foreground: "#e4e4e7",
          cursor: "#e4e4e7",
          cursorAccent: "#09090b",
          selectionBackground: "#3f3f46",
          selectionForeground: "#fafafa",
          black: "#18181b",
          brightBlack: "#3f3f46",
          red: "#f87171",
          brightRed: "#fca5a5",
          green: "#4ade80",
          brightGreen: "#86efac",
          yellow: "#fbbf24",
          brightYellow: "#fde68a",
          blue: "#60a5fa",
          brightBlue: "#93c5fd",
          magenta: "#c084fc",
          brightMagenta: "#d8b4fe",
          cyan: "#22d3ee",
          brightCyan: "#67e8f9",
          white: "#e4e4e7",
          brightWhite: "#fafafa",
        },
      });
      const fit = new FitAddon.FitAddon();
      term.loadAddon(fit);
      term.open(document.getElementById("term"));
      fit.fit();

      const wsUrl = new URL("api/pty", window.location.href);
      wsUrl.protocol = location.protocol === "https:" ? "wss:" : "ws:";
      const ws = new WebSocket(wsUrl);
      ws.binaryType = "arraybuffer";
      const sendResize = () =>
        ws.readyState === 1 &&
        ws.send(
          JSON.stringify({ t: "resize", cols: term.cols, rows: term.rows }),
        );
      ws.onopen = () => {
        sendResize();
        term.focus();
      };
      new ResizeObserver(() => {
        fit.fit();
        sendResize();
      }).observe(document.getElementById("term"));
      ws.onmessage = (e) =>
        term.write(
          typeof e.data === "string" ? e.data : new Uint8Array(e.data),
        );
      term.onData(
        (d) => ws.readyState === 1 && ws.send(JSON.stringify({ t: "in", d })),
      );
      term.attachCustomKeyEventHandler((event) => {
        if (
          event.type !== "keydown" ||
          !event.ctrlKey ||
          event.altKey ||
          event.metaKey ||
          event.shiftKey ||
          event.key.length !== 1
        )
          return true;
        const code = event.key.toUpperCase().charCodeAt(0) - 64;
        if (code < 0 || code > 31) return true;
        if (ws.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify({ t: "in", d: String.fromCharCode(code) }));
        }
        return false;
      });
      window.addEventListener("resize", () => {
        fit.fit();
        sendResize();
      });
        </script>
    </body>
</html>
