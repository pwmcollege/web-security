{% extends "layout.html" %}
{% block content %}
    <div class="stage">
        <h1 class="wordmark">Oracle<span class="dot">.</span></h1>
        <p class="tagline">Turn a card to read your fortune</p>

        <div class="reading">
            <div id="card" class="card">
                <div class="face back"><span class="back-mark">✦</span></div>
                <div id="front" class="face front">
                    <div id="front-text" class="front-text"></div>
                </div>
            </div>
        </div>

        <div class="divider"></div>
        <div id="deck" class="deck"></div>
    </div>

    <script>
        const card = document.getElementById("card");
        const front = document.getElementById("front");
        const frontText = document.getElementById("front-text");
        const deck = document.getElementById("deck");
        let shown = null;

        async function fetchFortune(name) {
            const response = await fetch("/api/fortune?name=" + encodeURIComponent(name));
            return response.json();
        }

        function paint(data) {
            if (data.error) {
                front.classList.add("error");
                frontText.textContent = data.error;
            } else {
                front.classList.remove("error");
                frontText.textContent = data.content;
            }
        }

        async function reveal(name) {
            const data = await fetchFortune(name);
            const wasFlipped = card.classList.contains("flipped");
            card.classList.remove("flipped");
            history.replaceState(null, "", "?card=" + encodeURIComponent(name));
            setTimeout(() => {
                paint(data);
                shown = name;
                card.classList.add("flipped");
            }, wasFlipped ? 450 : 40);
        }

        function unreveal() {
            card.classList.remove("flipped");
            history.replaceState(null, "", location.pathname);
        }

        card.addEventListener("click", () => {
            if (card.classList.contains("flipped")) {
                unreveal();
            } else if (shown) {
                reveal(shown);
            }
        });

        async function load() {
            const names = (await (await fetch("/api/fortunes")).json()).fortunes;
            const readings = await Promise.all(names.map(fetchFortune));

            names.forEach((name, i) => {
                const mini = document.createElement("button");
                mini.type = "button";
                mini.className = "mini";
                const label = document.createElement("span");
                label.className = "mini-name";
                label.textContent = (readings[i].content || "").split(/\s+/).filter(Boolean).slice(0, 3).join(" ");
                mini.append(label);
                mini.addEventListener("click", () => {
                    if (card.classList.contains("flipped") && shown === name) {
                        unreveal();
                    } else {
                        reveal(name);
                    }
                });
                deck.appendChild(mini);
            });

            const requested = new URLSearchParams(location.search).get("card");
            if (requested) {
                reveal(requested);
            } else if (names.length) {
                paint(readings[0]);
                shown = names[0];
            }
        }

        load();
    </script>
{% endblock %}
