<!DOCTYPE html>
<html lang="en" class="h-full">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Files</title>
        <script src="https://cdn.internal/tailwind/tailwind.min.js"></script>
        <script>
      tailwind.config = {
        theme: { extend: { fontFamily: { sans: ["Inter", "ui-sans-serif", "system-ui", "sans-serif"] } } },
      };
        </script>
        <script src="https://cdn.internal/lucide/lucide.min.js"></script>
        <link rel="stylesheet" href="https://cdn.internal/fonts/inter.css" />
        <link rel="stylesheet" href="/static/style.css" />
    </head>
    <body class="h-dvh overflow-hidden bg-white text-zinc-900 font-sans antialiased flex flex-col">
        <header class="shrink-0 border-b border-zinc-100 bg-white">
            <div class="mx-auto max-w-[1080px] h-[56px] px-5 flex items-center">
                <a href="/"
                   class="flex items-center gap-2 text-[18px] font-extrabold tracking-tight text-zinc-900 select-none">
                    <i data-lucide="folder" class="h-5 w-5 text-zinc-900"></i>
                    <span>Files<span class="text-zinc-300">.</span></span>
                </a>
            </div>
        </header>
        <main class="flex-1 min-h-0 w-full mx-auto max-w-[1080px] flex flex-col">
            {% block content %}{% endblock %}
        </main>
        <script>
      lucide.createIcons();
        </script>
    </body>
</html>
