{% extends "layout.html" %}
{% block content %}
    <div class="px-5 py-7">
        <form id="snapshot-form">
            <label class="mb-2 block text-[13px] font-medium text-zinc-500">Path to snapshot</label>
            <div class="flex items-stretch gap-2">
                <input id="path" autofocus autocomplete="off"
                       placeholder="/var/www/uploads"
                       class="flex-grow rounded-xl border border-zinc-200 bg-zinc-50 px-4 py-3 font-mono text-[14px] text-zinc-900 placeholder:text-zinc-400 outline-none transition-colors focus:border-zinc-900 focus:bg-white" />
                <button type="submit"
                        class="inline-flex shrink-0 cursor-pointer items-center gap-1.5 rounded-xl bg-zinc-900 px-5 text-[14px] font-semibold text-white transition-all hover:bg-zinc-700 active:scale-[0.98]">
                    <i data-lucide="package" class="h-4 w-4"></i>
                    Create snapshot
                </button>
            </div>
        </form>

        <div id="error" class="mt-6 hidden items-center gap-2 rounded-xl bg-rose-50 px-4 py-3 text-[13px] font-medium text-rose-600">
            <i data-lucide="shield-alert" class="h-4 w-4 shrink-0"></i>
            <span id="error-text"></span>
        </div>

        <div id="result" class="mt-6 hidden overflow-hidden rounded-2xl border border-zinc-200">
            <div class="flex items-center justify-between gap-3 border-b border-zinc-100 bg-zinc-50 px-4 py-3">
                <div class="flex min-w-0 items-center gap-2.5">
                    <span class="flex h-8 w-8 shrink-0 items-center justify-center rounded-lg bg-zinc-900 text-white">
                        <i data-lucide="file-archive" class="h-4 w-4"></i>
                    </span>
                    <div class="min-w-0">
                        <div class="truncate text-[14px] font-semibold text-zinc-900">backup.tar</div>
                        <div class="text-[12px] text-zinc-400">Snapshot created</div>
                    </div>
                </div>
                <a href="/api/backup" download
                   class="inline-flex shrink-0 cursor-pointer items-center gap-1.5 rounded-lg border border-zinc-200 px-3 py-1.5 text-[13px] font-medium text-zinc-700 transition-colors hover:bg-zinc-50">
                    <i data-lucide="download" class="h-3.5 w-3.5"></i>
                    Download
                </a>
            </div>
            <pre id="output" class="overflow-x-auto px-4 py-3.5 font-mono text-[13px] leading-6 text-zinc-600 whitespace-pre-wrap break-words"></pre>
        </div>
    </div>

    <script>
        const form = document.getElementById("snapshot-form");
        const input = document.getElementById("path");
        const errorBox = document.getElementById("error");
        const errorText = document.getElementById("error-text");
        const result = document.getElementById("result");
        const output = document.getElementById("output");

        form.addEventListener("submit", async (event) => {
            event.preventDefault();
            const response = await fetch("/api/snapshot", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ path: input.value }),
            });
            const data = await response.json();
            if (data.error) {
                errorText.textContent = data.error;
                errorBox.classList.remove("hidden");
                errorBox.classList.add("flex");
                result.classList.add("hidden");
            } else {
                output.textContent = data.output;
                result.classList.remove("hidden");
                errorBox.classList.add("hidden");
                errorBox.classList.remove("flex");
            }
        });
    </script>
{% endblock %}
